services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      CORPUS_DIR: /app/data/corpus
      CHROMA_PERSIST_DIR: /app/data/chroma_index
      HF_HOME: /home/appuser/.cache/huggingface
    volumes:
      - type: bind
        source: ./data/corpus
        target: /app/data/corpus
        read_only: true
        bind:
          create_host_path: false
      - chroma-data:/app/data/chroma_index
      - model-cache:/home/appuser/.cache/huggingface
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3

volumes:
  chroma-data:
  model-cache:
